packages:
  - server
  - web
  - packages/*  # @mdu/snapshot-render — shared rendering core consumed by this tool AND the standalone Extra/snapshot-viewer

# Explicitly reviewed script execution (pnpm ≥ 12: allowBuilds, was
# onlyBuiltDependencies). Only these dependencies may run postinstall build
# scripts; everything else fails the install when unreviewed.
allowBuilds:
  esbuild: true
  fdir: true
  picomatch: true
