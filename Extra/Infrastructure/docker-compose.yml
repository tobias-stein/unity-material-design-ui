# InfluxDB v2 for Unity-MaterialDesign-UI telemetry, plus the telemetry-viewer
# tool (Fastify API + web client on http://localhost:8087).
#
#   docker compose up -d      # start  (Influx UI: http://localhost:8086, user: admin / adminadmin;
#                             #         viewer: http://localhost:8087)
#   docker compose down       # stop   (data survives in the named volumes)
#
# The org / bucket / token below MUST match the defaults in
# Assets/Runtime/Telemetry/TelemetryConfig.cs ("InfluxDB" section):
#   url    = http://localhost:8086
#   org    = mdu
#   bucket = ui
#   token  = mdu-local-dev-token-0123456789abcdef
#
# This token is a *local development* token baked into a compose file and a
# Unity config default — never reuse it anywhere real, and don't ship a
# TelemetrySettings asset containing a production token in a build.

services:
  telemetry-viewer:
    # Real tool (from P1 on, plan ui-telemetry-viewer.md §11/P1): Fastify API +
    # static web client on one port. Strictly read-only toward InfluxDB.
    # P6: the web UI's "Sources" panel can switch influx⇄directory-only mode,
    # override LP_ROOT/SNAPSHOT_ROOT, re-scan and import .lp files at runtime —
    # no container restart needed; the env vars below remain the defaults.
    build: ../telemetry-viewer
    image: mdu/telemetry-viewer:latest
    container_name: mdu-ui-telemetry-viewer
    restart: unless-stopped
    ports:
      - "8087:8087"
    depends_on:
      influxdb:
        condition: service_started
    environment:
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: mdu
      INFLUX_BUCKET: ui
      INFLUX_TOKEN: mdu-local-dev-token-0123456789abcdef
      LOG_LEVEL: info
      # Optional .lp file source — mount a host directory and point LP_ROOT (or
      # SNAPSHOT_ROOT for snapshot files) at it, e.g.:
      #   - <your telemetry dir>:/data:ro
      #   - LP_ROOT: /data/Telemetry/events
      #   - SNAPSHOT_ROOT: /data/Telemetry/snapshots

  influxdb:
    image: influxdb:2.7
    container_name: mdu-ui-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin
      DOCKER_INFLUXDB_INIT_ORG: mdu
      DOCKER_INFLUXDB_INIT_BUCKET: ui
      DOCKER_INFLUXDB_INIT_RETENTION: 0s # keep everything (dev)
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mdu-local-dev-token-0123456789abcdef
    volumes:
      - influxdb2-data:/var/lib/influxdb2
      - influxdb2-config:/etc/influxdb2

volumes:
  influxdb2-data:
  influxdb2-config:
